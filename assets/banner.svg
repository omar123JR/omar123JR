<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 180" width="100%" height="180">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080B10" />
      <stop offset="50%" stop-color="#0D1117" />
      <stop offset="100%" stop-color="#161B22" />
    </linearGradient>

    <!-- Glowing Accent Gradient -->
    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#58A6FF" />
    </linearGradient>

    <!-- Scanline Pattern -->
    <pattern id="scanlines" width="100" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="100" y2="0" stroke="#000000" stroke-width="1" opacity="0.15" />
    </pattern>

    <!-- Grid Pattern -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#21262D" stroke-width="0.5" opacity="0.4" />
    </pattern>
  </defs>

  <!-- Base Card -->
  <rect width="920" height="180" rx="10" fill="url(#bg-gradient)" stroke="#30363D" stroke-width="1.2" />
  
  <!-- Grid Overlay -->
  <rect width="920" height="180" rx="10" fill="url(#grid)" />
  
  <!-- Scanlines -->
  <rect width="920" height="180" rx="10" fill="url(#scanlines)" />

  <!-- Top Bar Decor -->
  <rect x="0" y="0" width="920" height="32" rx="10" fill="#161B22" fill-opacity="0.8" />
  <rect x="0" y="24" width="920" height="8" fill="#161B22" fill-opacity="0.8" />
  <line x1="0" y1="32" x2="920" y2="32" stroke="#30363D" stroke-width="1" />

  <!-- Terminal Window Dots -->
  <circle cx="22" cy="16" r="4.5" fill="#FF5F56" />
  <circle cx="38" cy="16" r="4.5" fill="#FFBD2E" />
  <circle cx="54" cy="16" r="4.5" fill="#27C93F" />

  <!-- Window Title -->
  <text x="75" y="20" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="11" fill="#8B949E" letter-spacing="1">soc-node-01://omar.sh [SECURE TRANSMISSION]</text>

  <!-- Status Indicator (Pulsing Green) -->
  <circle cx="875" cy="16" r="4" fill="#3FB950">
    <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite" />
  </circle>
  <text x="830" y="20" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="10" fill="#3FB950" font-weight="600">ONLINE</text>

  <!-- Tactical HUD Corner Markers -->
  <!-- Top Left -->
  <path d="M 12 44 L 12 56 M 12 44 L 24 44" stroke="#58A6FF" stroke-width="1.5" fill="none" opacity="0.6" />
  <!-- Top Right -->
  <path d="M 908 44 L 908 56 M 908 44 L 896 44" stroke="#58A6FF" stroke-width="1.5" fill="none" opacity="0.6" />
  <!-- Bottom Left -->
  <path d="M 12 168 L 12 156 M 12 168 L 24 168" stroke="#58A6FF" stroke-width="1.5" fill="none" opacity="0.6" />
  <!-- Bottom Right -->
  <path d="M 908 168 L 908 156 M 908 168 L 896 168" stroke="#58A6FF" stroke-width="1.5" fill="none" opacity="0.6" />

  <!-- Main Identity Content -->
  <text x="460" y="85" text-anchor="middle" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="28" font-weight="800" fill="url(#accent-cyan)" letter-spacing="4">
    [ SYSTEM NODE : OMAR ]
  </text>

  <text x="460" y="118" text-anchor="middle" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="13" font-weight="600" fill="#E6EDF3" letter-spacing="2">
    &gt; DEFENSIVE SECURITY &amp; SOC INCIDENT AUTOMATION &lt;
  </text>

  <text x="460" y="145" text-anchor="middle" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="11" fill="#8B949E" letter-spacing="1">
    SIEM TELEMETRY // WAZUH RULES // SOAR PLAYBOOKS // DOCKER HARDENING
  </text>
</svg>

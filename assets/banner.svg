<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Omar Salem Aljerbi — Cybersecurity Student</title>
  <desc id="desc">A dark blue SOC-inspired banner with a network radar and blue-team focus areas.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset=".58" stop-color="#0b1c2a"/>
      <stop offset="1" stop-color="#101b32"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#35d0bd"/>
      <stop offset="1" stop-color="#54a8ff"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#35d0bd" stop-opacity=".2"/>
      <stop offset="1" stop-color="#35d0bd" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#7fa3ba" stroke-opacity=".09" stroke-width="1"/>
    </pattern>
    <pattern id="dots" width="12" height="12" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#83a6bc" fill-opacity=".18"/>
    </pattern>
    <clipPath id="clip"><rect x="0" y="0" width="1200" height="320" rx="22"/></clipPath>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <rect width="1200" height="320" fill="url(#grid)"/>
    <rect x="0" y="0" width="1200" height="320" fill="url(#dots)" opacity=".5"/>
    <circle cx="1015" cy="154" r="245" fill="url(#glow)"/>
    <path d="M0 286H1200" stroke="#35d0bd" stroke-opacity=".13"/>
    <path d="M0 0H1200V7H0Z" fill="url(#accent)"/>
    <path d="M42 42V278" stroke="#35d0bd" stroke-width="3" stroke-linecap="round"/>
    <circle cx="42" cy="42" r="4" fill="#35d0bd"/>
    <circle cx="42" cy="278" r="4" fill="#35d0bd"/>

    <g font-family="Segoe UI, Arial, sans-serif">
      <text x="72" y="58" fill="#72d8d0" font-size="13" font-weight="700" letter-spacing="3">FIELD NOTES  /  BLUE TEAM</text>
      <text x="70" y="126" fill="#f0f6fc" font-size="43" font-weight="800" letter-spacing="1.2">OMAR SALEM ALJERBI</text>
      <text x="73" y="164" fill="#b9c9d8" font-size="20" font-weight="600" letter-spacing="2.2">CYBERSECURITY STUDENT  ·  YEAR 4</text>
      <rect x="72" y="187" width="440" height="2" rx="1" fill="url(#accent)" opacity=".8"/>
      <text x="73" y="218" fill="#e6edf3" font-size="16" font-weight="600">SOC / SIEM  ·  INCIDENT RESPONSE  ·  OSINT</text>
      <text x="73" y="246" fill="#9fb3c5" font-size="15">Developing skills in malware analysis and defensive security</text>
      <g transform="translate(73 270)">
        <rect width="108" height="27" rx="13.5" fill="#102d3c" stroke="#35d0bd" stroke-opacity=".5"/>
        <text x="54" y="18" text-anchor="middle" fill="#91eee1" font-size="11" font-weight="700" letter-spacing="1">WAZUH LABS</text>
        <rect x="118" width="132" height="27" rx="13.5" fill="#102d3c" stroke="#54a8ff" stroke-opacity=".5"/>
        <text x="184" y="18" text-anchor="middle" fill="#abd3ff" font-size="11" font-weight="700" letter-spacing="1">SOAR PROJECTS</text>
        <rect x="260" width="124" height="27" rx="13.5" fill="#102d3c" stroke="#35d0bd" stroke-opacity=".5"/>
        <text x="322" y="18" text-anchor="middle" fill="#91eee1" font-size="11" font-weight="700" letter-spacing="1">OSINT</text>
      </g>
    </g>

    <g transform="translate(930 155)">
      <circle r="132" fill="none" stroke="#54a8ff" stroke-opacity=".12" stroke-width="1"/>
      <circle r="111" fill="none" stroke="#54a8ff" stroke-opacity=".2" stroke-width="1" stroke-dasharray="3 8"/>
      <circle r="86" fill="none" stroke="#35d0bd" stroke-opacity=".3" stroke-width="1"/>
      <circle r="58" fill="none" stroke="#54a8ff" stroke-opacity=".25" stroke-width="1"/>
      <circle r="27" fill="none" stroke="#35d0bd" stroke-opacity=".35" stroke-width="1"/>
      <path d="M-142 0H142M0-142V142M-101-101L101 101M-101 101L101-101" stroke="#89a9c1" stroke-opacity=".13" stroke-width="1"/>
      <path d="M0 0L93-76" stroke="url(#accent)" stroke-width="2.2" stroke-linecap="round"/>
      <path d="M0 0L-64 84" stroke="#54a8ff" stroke-opacity=".45" stroke-width="1.5"/>
      <circle cx="0" cy="0" r="7" fill="#35d0bd"/>
      <circle cx="93" cy="-76" r="5" fill="#54a8ff"/>
      <circle cx="-64" cy="84" r="4" fill="#35d0bd"/>
      <circle cx="66" cy="55" r="4" fill="#35d0bd"/>
      <circle cx="-77" cy="-45" r="3.5" fill="#54a8ff"/>
      <path d="M-77-45L-118-82M66 55L116 83M93-76L130-110" stroke="#7fa3ba" stroke-opacity=".55" stroke-dasharray="3 5"/>
      <g font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="700" letter-spacing="1.2">
        <text x="-148" y="-91" fill="#8ecbff">SIEM</text>
        <text x="119" y="-116" fill="#8ecbff">IR</text>
        <text x="119" y="97" fill="#7be3d3">OSINT</text>
        <text x="-148" y="111" fill="#7be3d3">SOC</text>
      </g>
    </g>

    <g transform="translate(1085 38)" font-family="Consolas, monospace">
      <rect width="83" height="25" rx="12.5" fill="#0d2b2a" stroke="#35d0bd" stroke-opacity=".65"/>
      <circle cx="14" cy="12.5" r="4" fill="#35d0bd"/>
      <text x="27" y="16.5" fill="#a4eee3" font-size="10" font-weight="700">LEARNING</text>
    </g>
    <text x="1128" y="294" text-anchor="end" fill="#8da4b7" font-family="Segoe UI, Arial, sans-serif" font-size="11" letter-spacing="2">TRIPOLI  /  LIBYA</text>
  </g>
</svg>